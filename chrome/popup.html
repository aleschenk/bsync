<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <template id="li_template">
      <li>
        <a>
          <h3 class="title">BSync</h3>
          <p class="pathname">Tab Pathname</p>
        </a>
      </li>
    </template>

    <h1>BSync</h1>

    <form>
      <p><label>Server: <input id="hostText" type="text" value="http://127.0.0.1:2544" /></label></p>
      <p><label>Account: <input id="accountIdText" type="text" value="aleschenk" /></label></p>
      <p><label>Session: <input id="sessionIdText" type="text" value="default" /></label></p>
      <p><label>Restore session in a new window<input id="sessionIdText" type="checkbox" value="true" /></label></p>
    </form>

    <button id="saveSessionButton">Save Tabs</button>
    <button id="getSessionButton">Get Tabs</button>
    <!-- <button id="syncButton">Sync</button>
    <input id="autoSyncCheck" type="checkbox">Automatic Sync</input> -->
    <!-- <button id="settingsButton">Settings</button> -->

    <script src="./popup.js" type="module"></script>
  </body>
</html>
